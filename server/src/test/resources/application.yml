# 测试专用配置：覆盖 src/main/resources/application.yml。
#
# 迭代 3（J3-0）口径：单测不再保留 H2 内存库，测试库一并切到 MySQL。
# 用独立的 onlineshop_test 库 + create-drop，保证与开发库 onlineshop 数据彻底隔离：
# 各测试类的 @BeforeEach 会 deleteAll() 清库，若指向开发库会把演示数据清空。
#
# 前置：本机 MySQL 已启动（或 DB_URL 指向可达实例），账号需有建库权限。
#   createDatabaseIfNotExist=true 让首次 mvn test 自动建库，无需手工 CREATE DATABASE
# 密码通过环境变量传入，与主配置同一口径：
#   setx DB_PASSWORD "你的密码"      # 配置一次，重开终端生效
#   DB_PASSWORD='xxx' mvn test      # 或临时传入
#
# 注意：Spring Boot 会以本文件完整覆盖主配置，主配置中用到的键必须在此重复声明。

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/onlineshop_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 测试库每次运行重建表结构，跑完自动 drop，不残留造数
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  seller:
    username: admin
    password: seller123
  upload:
    # 测试上传的图片写到 target 下，随 mvn clean 一起清除，不污染 data/uploads
    dir: ./target/test-uploads
  history:
    page-size: 10

logging:
  level:
    root: WARN
    com.group1.onlineshop: WARN
