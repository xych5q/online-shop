<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好物排队购 —— 买家页</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
  <!-- 顶栏（US-16 线框图）：标题 + 搜索框 + 搜索按钮 + 登录入口 -->
  <div class="topbar">
    <div>
      <h1>好物排队购</h1>
      <div class="sub">在线购物 · 先到先得 · 线下当面交易</div>
    </div>
    <div class="topbar-tools">
      <input type="text" id="searchInput" placeholder="搜索商品名称或描述" maxlength="100">
      <button class="btn btn-search" id="searchBtn">搜索</button>
      <span id="topbarUser" class="topbar-user"></span>
      <a href="/admin.html" class="topbar-admin">卖家入口</a>
    </div>
  </div>

  <!-- 类别筛选（US-16 线框图）：全部 / 一级类别 ▾（点开列二级，可叠加关键词） -->
  <div class="cat-row">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="list-hint" id="listHint"></div>
  </div>

  <!-- 商品列表（US-16）：只显示在售商品，默认按发布时间倒序，每页 12 条 -->
  <div class="grid" id="productGrid"></div>
  <div class="empty" id="listEmpty" style="display:none">没有找到相关商品</div>
  <div class="pager" id="pager"></div>
  <div class="list-note">列表只显示在售商品（冻结中 / 交易中 / 已售罄的商品不出现）；无结果时显示空状态「没有找到相关商品」。</div>
</div>

<div class="toast" id="toast"></div>
<script src="/auth.js"></script>
<script src="/buyer.js"></script>
</body>
</html>
