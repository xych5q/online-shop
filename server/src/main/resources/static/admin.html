<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卖家后台 —— 好物排队购</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
  <div class="topbar">
    <div>
      <h1>卖家后台</h1>
      <div class="sub">单件在售 · 先到先得 · 队首自动进入交易</div>
    </div>
    <div style="display:flex; gap:14px; align-items:center">
      <a href="javascript:;" id="changePwdLink">修改密码</a>
      <a href="/">买家页 →</a>
    </div>
  </div>

  <!-- 登录 -->
  <div class="card" id="loginCard">
    <h2>卖家登录</h2>
    <div class="form" style="max-width:360px">
      <div>
        <label>用户名</label>
        <input type="text" id="loginUser" placeholder="卖家用户名">
      </div>
      <div>
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="密码">
      </div>
      <div class="error" id="loginError"></div>
      <button class="btn btn-primary" id="loginBtn">登录</button>
    </div>
  </div>

  <!-- 后台主体 -->
  <div id="adminBody" style="display:none">
    <div class="tabs">
      <button class="active" data-tab="current">当前商品</button>
      <button data-tab="history">历史记录</button>
    </div>

    <div id="tab-current">
      <div class="card" id="currentProductCard"></div>
      <div class="card" id="queueCard"></div>
      <div class="card" id="pendingCard" style="display:none"></div>
    </div>

    <div id="tab-history" style="display:none">
      <div class="card" id="historyCard"></div>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-mask" id="pwdMask">
  <div class="modal">
    <button class="close-x" data-close="pwdMask">×</button>
    <h3>修改密码</h3>
    <div class="form">
      <div>
        <label>原密码</label>
        <input type="password" id="oldPwd">
      </div>
      <div>
        <label>新密码（不少于 8 位）</label>
        <input type="password" id="newPwd">
      </div>
      <div>
        <label>确认新密码</label>
        <input type="password" id="newPwd2">
      </div>
      <div class="error" id="pwdError"></div>
      <button class="btn btn-primary btn-block" id="pwdSubmit">确认修改</button>
    </div>
  </div>
</div>

<!-- 历史意向弹窗 -->
<div class="modal-mask" id="histMask">
  <div class="modal" style="max-width:640px">
    <button class="close-x" data-close="histMask">×</button>
    <h3 id="histTitle">意向购买人</h3>
    <div id="histDetail"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
