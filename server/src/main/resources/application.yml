server:
  port: ${SERVER_PORT:8080}

# ============================================================================
# 数据源：迭代 3 起由 H2 文件库切换为 MySQL（J3-0）。旧 H2 数据不迁移。
#
# 连接信息一律走环境变量，仓库内不出现任何人的真实密码：
#   DB_URL       默认 jdbc:mysql://localhost:3306/onlineshop（本地 MySQL，含自动建库）
#   DB_USER      默认 root
#   DB_PASSWORD  默认空；本机有密码时必须设置，否则启动报 Access denied
#
# 本地配置一次（Windows，重开终端生效）：
#   setx DB_PASSWORD "你的密码"
# 临时覆盖启动参数：
#   java -jar target/online-shop.jar --spring.datasource.password=xxx
#
# URL 参数说明（缺一个就连不上或中文乱码）：
#   createDatabaseIfNotExist=true  首次启动自动建库，免手工执行 CREATE DATABASE
#   allowPublicKeyRetrieval=true   MySQL 8 默认 caching_sha2_password，不加报 Public Key Retrieval
#   useSSL=false                   本地/容器内均为明文连接
#   characterEncoding=utf8         配合库的 utf8mb4，避免中文变问号
# ============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/onlineshop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 首次连空库时由 Hibernate 建表；字段只增不减，缩列与改类型不会自动执行
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  # 初始卖家账号（首次启动自动创建，需求方：系统直接指定，无注册）
  seller:
    username: admin
    password: seller123
  upload:
    dir: ./data/uploads
  history:
    page-size: 10

logging:
  level:
    root: INFO
    com.group1.onlineshop: DEBUG
