server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/onlineshop;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  # 初始卖家账号（首次启动自动创建，需求方：系统直接指定，无注册）
  seller:
    username: admin
    password: seller123
  upload:
    dir: ./data/uploads
  history:
    page-size: 10

logging:
  level:
    root: INFO
    com.group1.onlineshop: DEBUG
